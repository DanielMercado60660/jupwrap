# Workspace for the clean-room SCF phase unwrapper.
[workspace]
resolver = "2"
members = [
    "crates/core", "crates/testkit",
    "crates/grid", "crates/mcf", "crates/nonconvex", "crates/costs",
    "crates/init", "crates/conncomp", "crates/solve", "crates/tiling",
    "crates/jupwrap", "crates/cli",
    "py",
]
# `py` needs a Python interpreter at build time; build it only through maturin.
default-members = [
    "crates/core", "crates/testkit",
    "crates/grid", "crates/mcf", "crates/nonconvex", "crates/costs",
    "crates/init", "crates/conncomp", "crates/solve", "crates/tiling",
    "crates/jupwrap", "crates/cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
jupwrap-core = { path = "crates/core" }
jupwrap-testkit = { path = "crates/testkit" }
jupwrap-grid = { path = "crates/grid" }
jupwrap-mcf = { path = "crates/mcf" }
jupwrap-nonconvex = { path = "crates/nonconvex" }
jupwrap-costs = { path = "crates/costs" }
jupwrap-init = { path = "crates/init" }
jupwrap-conncomp = { path = "crates/conncomp" }
jupwrap-solve = { path = "crates/solve" }
jupwrap-tiling = { path = "crates/tiling" }
jupwrap = { path = "crates/jupwrap" }
rayon = "=1.12.0"
serde_json = "=1.0.154"
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py310"] }

[profile.release]
debug = false
opt-level = 3
